<h3>Fixed</h3>
<ul><li>Apple Intelligence on macOS 26 and 27 no longer leaves sentences or weekdays starting with a lowercase letter (&quot;range. and next week&quot;, &quot;the friday meeting&quot;). Names written in mixed case, such as gVisor or iPhone, keep their spelling, and a slice that continues a sentence stays lowercase.</li></ul>

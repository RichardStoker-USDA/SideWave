<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .bg { fill: #0071e3; }
    .wave { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2997ff; }
      .wave { fill: #0a0a0a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <g class="wave" transform="translate(16,16)">
    <rect x="-2" y="-10" width="4" height="20" rx="2"/>
    <rect x="-8" y="-7" width="4" height="14" rx="2"/>
    <rect x="4" y="-7" width="4" height="14" rx="2"/>
    <rect x="-14" y="-4" width="4" height="8" rx="2"/>
    <rect x="10" y="-4" width="4" height="8" rx="2"/>
  </g>
</svg>
